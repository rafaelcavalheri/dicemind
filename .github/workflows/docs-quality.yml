name: Qualidade da Documentação

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  markdown-lint:
    name: Lint de Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint dos arquivos Markdown
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: "**/*.md"
          config: .markdownlint.json

  link-check:
    name: Verificação de Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verificar links quebrados
        uses: lycheeverse/lychee-action@v1
        with:
          args: --verbose --no-progress '**/*.md'
          fail: true
